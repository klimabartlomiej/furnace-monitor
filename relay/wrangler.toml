# The remote-access relay (src/index.js) on Cloudflare's free plan: https://furnace-relay.klimsoft.workers.dev
# Deployed by .github/workflows/relay.yml on every push that changes relay/ (or by hand: npx wrangler deploy).
# The firmware's default host (RELAY_HOST in PiecTemp.ino) points here; the web app can set another one.
name = "furnace-relay"
account_id = "95897b1e1728f475886e81afb5dfa37f"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# The free plan offers only SQLite-backed Durable Objects.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
